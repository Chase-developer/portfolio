<!DOCTYPE html>
<html lang="en">
<head>
    <div th:insert="~{fragments/default :: head-content}"></div>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
	<title th:text="${title}">Default Title</title>
</head>
<body>
	<div class="background"></div>
	<canvas id="waveCanvas"></canvas>
	<div th:replace="~{fragments/default :: header-nav}"></div>
    <textarea id="raw-text" th:data-src="@{${file}}" hidden></textarea>
	<p id="titlecenter" class="section-text title" th:text="${title}"></p>
    
    <section>
        <div class="page-nav-layout">
            <a th:href="@{'/journey/' + ${prev}}" th:if="${showPrev}">
                <th:block th:replace="~{fragments/default :: sync-button('Prev')}"/>
            </a>
            <span th:unless="${showPrev}" class="placeholder">Placeholder</span>
            
            <a th:href="@{'/journey/' + ${next}}" th:if="${showNext}">
                <th:block th:replace="~{fragments/default :: sync-button('Next')}"/>
            </a>
            <span th:unless="${showNext}" class="placeholder">Placeholder</span>
            
         
        </div>
        
	    <div class="wiki-layout">
            <div class="content">
                
        	    
        	
        		    <!-- Raw Markdown (Hidden) -->
        			
        	
        
        	    <!-- Rendered Markdown -->
        		<div id="output" class="tab markdown">

                    <span class="loading-text">Loading...<span>
                </div>
            </div>
		    <div class="navigation">
				<div class="tab block">
					<div class="nav-wiki">
                        <button class="toggle-action" data-toggle-id="toggle-nav">
                            <div class="left">
                                <span id="toggle-nav-switch" class="triangle">
                                    <img th:src="@{/images/arrowdown.png}" class="arrow-icon">
                                    <img th:src="@{/images/arrowright.png}" class="arrow-icon hidden">
                                </span>
                                <span class="section-text header">
                                Chapters
                                </span>
                            </div>

                        </button>
                        <div id="toggle-nav-content" class="toggle-content">
                            <a th:href=@{/journey} class="link">Timeline</a><br>
                            <th:block th:each="chapter : ${chapters}">
                                <a th:href="@{'/journey/' + ${chapter.chp}}" class="link" th:text="${chapter.name}"></a><br>
                            </th:block>
                        </div>
					</div>
				</div>
		    </div>
		</div>
        
        <div class="page-nav-layout">
            <a th:href="@{'/journey/' + ${prev}}" th:if="${showPrev}">
                <th:block th:replace="~{fragments/default :: sync-button('Prev')}"/>
            </a>
            <span th:unless="${showPrev}" class="placeholder">Placeholder</span>
            
            <a th:href="@{'/journey/' + ${next}}" th:if="${showNext}">
                <th:block th:replace="~{fragments/default :: sync-button('Next')}"/>
            </a>
            <span th:unless="${showNext}" class="placeholder">Placeholder</span>
            
         
        </div>
	</section>
	
	<section th:insert="~{fragments/default :: contact}"></section>
    <th:block th:replace="~{fragments/default :: footer-script}"></th:block>
    <script th:src="@{/js/toggle.js}"></script>
	<script th:src="@{/js/markdown.js}"></script>
	
	
</body>
</html>
