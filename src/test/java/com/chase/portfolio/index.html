<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
	<p th:text="'Thymeleaf is working!'"></p>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <nav>
            <h1>My Portfolio</h1>
            <ul>
				<li><button onclick="location.href='#about'">About</button></li>
				<li><button onclick="location.href='#projects'">Projects</button></li>
				<li><button onclick="location.href='#contact'">Contact</button></li>
                
            </ul>
        </nav>
    </header>
    
    <section id="about">
        <h2>About Me</h2>
        <p>Welcome to my portfolio! I specialize in cybersecurity and software development.</p>
    </section>
    
    <section id="projects">
        <h2>Projects</h2>
        <div class="project">
            <h3>Project Name</h3>
            <p>Description of the project.</p>
        </div>
    </section>
    
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@example.com</p>
        <p>LinkedIn: <a href="#">My Profile</a></p>
    </section>
    
</body>
</html>
