name: Auto Deployment with Docker Compose

on:
  push:
    branches:
      - main  # Trigger when code is pushed to the main branch
  pull_request:
    branches:
      - main  # Trigger on PR to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Gradle (if you use Gradle wrapper)
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'

    # Step 3: Build with Gradle
    - name: Build with Gradle
      run: ./gradlew build -x test  # Skip tests for faster builds (adjust as needed)

    # Step 4: Log in to Docker Hub using GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Your Docker Hub username stored in GitHub secrets
        password: ${{ secrets.DOCKER_PASSWORD }}  # Your Docker Hub password stored in GitHub secrets

    # Step 5: Build Docker image
    - name: Build Docker image
      run: docker build -t chasedeveloper/portfolio:latest .

    # Step 6: Push Docker image to Docker Hub
    - name: Push Docker image
      run: docker push chasedeveloper/portfolio:latest

    # Step 7: SSH into your server and deploy
    - name: SSH into server and deploy
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd portfolio/docker
          docker-compose down
          docker-compose pull
          docker-compose up -d
